[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imago"
version = "0.1.0"
description = "AI-powered documentation coach for managing and improving technical documentation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "The Automagicians" }
]
keywords = ["documentation", "ai", "cli", "markdown", "git"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
    "anthropic>=0.18.0",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
imago = "imago.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/imago"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
